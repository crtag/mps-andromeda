<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUICK Trajectory Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section id="trajectory-section">
            <h2>Create Trajectory Simulation</h2>
            <form id="trajectory-form">
                <div id="drop-zone" class="drop-zone">
                    Drag and drop job spec file here or click to browse
                    <input type="file" id="file-input" hidden accept=".in">
                </div>
                <div id="status" class="status" style="display: none;"></div>
                
                <div class="direction-group">
                    <label>Direction:</label>
                    <div class="direction-options">
                        <label class="radio-label" title="Z">
                            <input type="radio" name="direction" value="[001]" checked>
                            [001]
                        </label>
                        <label class="radio-label" title="-Z">
                            <input type="radio" name="direction" value="[00-1]">
                            [00⁻1]
                        </label>
                        <label class="radio-label" title="X">
                            <input type="radio" name="direction" value="[100]">
                            [100]
                        </label>
                        <label class="radio-label" title="-X">
                            <input type="radio" name="direction" value="[-100]">
                            [⁻100]
                        </label>
                        <label class="radio-label" title="Y">
                            <input type="radio" name="direction" value="[010]">
                            [010]
                        </label>
                        <label class="radio-label" title="-Y">
                            <input type="radio" name="direction" value="[0-10]">
                            [0⁻10]
                        </label>
                    </div>
                </div>

                <div class="step-details">
                    <div class="form-group">
                        <label for="step-size">Step Size (Å):</label>
                        <input type="number" id="step-size" value="0.1" step="0.1" min="0.1" required>
                    </div>

                    <div class="form-group">
                        <label for="steps-num">Number of Steps:</label>
                        <input type="number" id="steps-num" value="50" min="1" step="1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="steered-atoms">Steered atoms:</label>
                    <textarea id="steered-atoms" rows="3" placeholder="Enter atom indices for steering" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Create Trajectory Job</button>
            </form>
        </section>
    </main>
    <script src="trajectory.js"></script>
</body>
</html>
