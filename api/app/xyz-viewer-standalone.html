<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            padding: 15px 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h3 {
            margin: 0;
            font-size: 18px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-buttons a,
        .header-buttons button {
            padding: 8px 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        .header-buttons a:hover,
        .header-buttons button:hover {
            background: #0052a3;
        }

        #viewer-container {
            flex: 1;
            background: white;
            position: relative;
        }

        #info-panel {
            padding: 10px 20px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
            font-size: 14px;
            font-family: monospace;
        }

        #atom-info, #distance-info {
            margin: 5px 0;
            white-space: pre-line;
        }

        .controls {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            text-align: center;
            background: #f5f5f5;
        }

        #trajectory-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #trajectory-controls button {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }

        #trajectory-controls button:hover {
            background: #f0f0f0;
        }

        #frame-info {
            min-width: 120px;
            text-align: center;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #666;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.1/3Dmol.js"></script>
    <script src="xyz-viewer.js"></script>
</head>
<body>
    <div class="header">
        <h3 id="title">Molecular Structure</h3>
        <div class="header-buttons">
            <a id="download-btn" download="">Download</a>
        </div>
    </div>

    <div id="viewer-container">
        <div class="loading">Loading molecule...</div>
    </div>

    <div id="info-panel">
        <div id="atom-info">Click atoms to measure distance</div>
        <div id="distance-info"></div>
    </div>

    <div class="controls">
        <div id="trajectory-controls" style="display: none;">
            <button id="prev-btn">←</button>
            <span id="frame-info">Frame 1 / 1</span>
            <button id="next-btn">→</button>
            <button id="play-btn">▶</button>
        </div>
    </div>

    <script>
        // Standalone XYZ Viewer
        const StandaloneViewer = {
            core: null,

            async init() {
                // Get URL parameters
                const params = new URLSearchParams(window.location.search);
                const url = params.get('url');
                const filename = params.get('filename');

                if (!url || !filename) {
                    document.querySelector('.loading').textContent = 'Error: Missing URL or filename';
                    return;
                }

                // Set title and download link
                document.getElementById('title').textContent = filename;
                document.getElementById('download-btn').href = url;
                document.getElementById('download-btn').download = filename;

                try {
                    // Fetch XYZ data
                    const response = await fetch(url);
                    const xyzData = await response.text();

                    // Create core viewer instance
                    this.core = createXYZViewerCore(
                        'viewer-container',
                        'atom-info',
                        'distance-info',
                        'frame-info'
                    );

                    // Parse frames
                    this.core.parseFrames(xyzData);

                    // Initialize viewer
                    this.core.initViewer();

                    // Render first frame
                    this.core.renderFrame(0);

                    // Set zoom once
                    this.core.viewer.zoomTo();
                    this.core.viewer.render();

                    // Setup controls
                    if (this.core.frames.length > 1) {
                        document.getElementById('trajectory-controls').style.display = 'flex';
                        this.core.updateFrameInfo();
                    }

                    // Remove loading message
                    document.querySelector('.loading').remove();

                } catch (error) {
                    console.error('Error loading XYZ:', error);
                    document.querySelector('.loading').textContent = 'Error loading XYZ file';
                }
            },

            nextFrame() {
                if (this.core) {
                    this.core.nextFrame();
                }
            },

            prevFrame() {
                if (this.core) {
                    this.core.prevFrame();
                }
            },

            togglePlay() {
                if (this.core) {
                    this.core.togglePlay('play-btn');
                }
            }
        };

        // Event listeners
        document.getElementById('prev-btn').addEventListener('click', () => StandaloneViewer.prevFrame());
        document.getElementById('next-btn').addEventListener('click', () => StandaloneViewer.nextFrame());
        document.getElementById('play-btn').addEventListener('click', () => StandaloneViewer.togglePlay());

        // Initialize when loaded
        window.addEventListener('load', () => StandaloneViewer.init());
    </script>
</body>
</html>
