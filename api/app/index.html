<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="gIRVD-vtZsC6OMBBZvBps2o0Ig1ehmpJDDcvqG2JdPc" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' http://localhost:* http://127.0.0.1:* https://www.gstatic.com https://*.cloudfunctions.net https://*.firebaseapp.com https://*.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Job Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Authentication Section -->
    <div id="auth-container" style="display: none;">
        <div id="auth-card">
            <h1>Job Manager</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" id="login-btn">Sign In</button>
                <div id="auth-error" class="auth-error"></div>
                <div class="forgot-password-link">
                    <a href="#" id="forgot-password-link">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Password Reset Modal -->
    <div id="reset-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Reset Password</h2>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
            <form id="reset-form">
                <div class="form-group">
                    <label for="reset-email">Email</label>
                    <input type="email" id="reset-email" required autocomplete="email">
                </div>
                <div class="modal-buttons">
                    <button type="button" id="cancel-reset-btn" class="secondary-btn">Cancel</button>
                    <button type="submit" id="reset-btn">Send Reset Link</button>
                </div>
                <div id="reset-message" class="reset-message"></div>
            </form>
        </div>
    </div>

    <main style="display: none;">
        <!-- Header with Sign Out -->
        <div id="app-header">
            <h1>Job Manager</h1>
            <div id="user-info">
                <span id="user-email"></span>
                <button id="signout-btn">Sign Out</button>
            </div>
        </div>

        <section id="upload-section"></section>

        <section id="pending-jobs" hidden>
            <h2>Pending Jobs</h2>
            <div class="jobs-list">
                <div class="no-jobs">Loading...</div>
            </div>
        </section>

        <section id="running-jobs" hidden>
            <h2>Running Jobs</h2>
            <div class="jobs-list">
                <div class="no-jobs">Loading...</div>
            </div>
        </section>

        <section id="completed-jobs" hidden>
            <div class="section-header">
                <h2>Completed Jobs <div id="completed-jobs-subtitle"></div></h2>
                <button id="table-view-btn" style="padding: 8px 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">
                    Table View
                </button>
            </div>
            <div class="jobs-list">
                <div class="no-jobs">Loading...</div>
            </div>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.5.0/luxon.min.js" integrity="sha512-SN7iwxiJt9nFKiLayg3NjLItXPwRfBr4SQSIugMeBFrD4lIFJe1Z/exkTZYAg3Ul-AfZEGws2PQ+xSoaWfxRQQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Firebase SDK -->
    <script>
    (function() {
        const hostname = window.location.hostname;
        const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';
        const isFirebaseHosting = hostname.endsWith('.web.app') || hostname.endsWith('.firebaseapp.com');

        // Firebase SDK sources
        const firebaseBase = isFirebaseHosting ? '/__/firebase/12.7.0' : 'https://www.gstatic.com/firebasejs/12.7.0';
        const firebaseScripts = [
            `${firebaseBase}/firebase-app-compat.js`,
            `${firebaseBase}/firebase-auth-compat.js`,
            `${firebaseBase}/firebase-functions-compat.js`,
        ];

        // Config: Firebase auto-init vs manual config file
        const configScript = isFirebaseHosting
            ? '/__/firebase/init.js'
            : (isLocal ? 'firebase-local-config.js' : 'firebase-config.js');

        const scripts = [
            ...firebaseScripts,
            configScript,
            'config-parser.js',
            'file-viewer.js',
            'upload.js',
            'app.js'
        ];

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        scripts.reduce((p, src) => p.then(() => loadScript(src)), Promise.resolve())
            .catch(err => console.error('Script loading failed:', err));
    })();
    </script>
</body>
</html>
