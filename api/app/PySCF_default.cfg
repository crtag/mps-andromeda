# PySCF Geometry Optimization Configuration File
WORKER=PySCF

# Most values set to defaults from PySCF
# To override defaults, create job .cfg with only the parameters you want to change


# Task to run: ENERGY, OPTIMIZE
TASK=ENERGY

SUPPORTED_TASKS=ENERGY, OPTIMIZE
#TODO: provide expected files here somehow

# Optional tags of the job
TAGS=


# ============================================================================
# METHOD
# ============================================================================

# Exchange-correlation functional 
FUNCTIONAL=b3lyp

# Basis set name 
BASIS=6-31g**

# Dispersion correction method
DISPERSION=d3bj


# ============================================================================
# MOLECULE SETTINGS
# ============================================================================

# Molecular charge 
CHARGE=0

# Spin multiplicity
MULTIPLICITY=1


# ============================================================================
# SCF CONVERGENCE PARAMETERS
# ============================================================================

# SCF energy convergence threshold
# Typical: 1e-6, 1e-8 (tight), 1e-5 (loose)
SCF_CONV_TOL=1e-6

# Maximum SCF iterations
SCF_MAX_CYCLE=50

# Verbosity level (0 = minimal, higher = more verbose)
VERBOSE=0

# Initial density matrix guess method
# Options: "minao", "atom"(SAD), "1e"/"hcore", "huckel", "mod_huckel", "vsap", "sap", "chkfile"
INIT_GUESS=minao

# Checkpoint file path for loading initial guess (empty = no checkpoint)
# Example: CHKFILE=some_name.chk
CHKFILE=

# DIIS subspace size (larger = more stable but slower)
DIIS_SPACE=8

# DIIS damping factor (0.0 to 1.0, higher = more damping)
# Helps with oscillating SCF convergence
DIIS_DAMP=0.0

# Level shift for difficult SCF convergence (in Hartree)
# Typical: 0.0, 0.1-0.5 (helps break symmetry)
LEVEL_SHIFT=0.0


# ============================================================================
# DFT GRID SETTINGS
# ============================================================================

# Grid quality level (0-9, higher = denser = more accurate but slower)
GRIDS_LEVEL=3


# ============================================================================
# DENSITY FITTING (RI-JK)
# ============================================================================

# Enable density fitting (True/False)
# True (enabled, speeds up calculations)
DENSITY_FIT=True


# ============================================================================
# GEOMETRY OPTIMIZATION PARAMETERS, TASK: OPTIMIZE
# ============================================================================

# Energy change convergence (Hartree)
OPT_CONVERGENCE_ENERGY=1e-6

# RMS gradient(force) convergence (Hartree/Bohr)
# geomeTRIC default (GAU set): 3e-4
# GAU_LOOSE set: 1.7e-3 (faster convergence)
OPT_CONVERGENCE_GRMS=3e-4

# Max gradient(force) convergence (Hartree/Bohr)
# geomeTRIC default (GAU set): 4.5e-4
# GAU_LOOSE set: 2.5e-3 (faster convergence)
OPT_CONVERGENCE_GMAX= 4.5e-4

# RMS displacement convergence (Angstrom)
# geomeTRIC default (GAU set): 1.2e-3
# GAU_LOOSE set: 6.7e-3 (faster convergence)
OPT_CONVERGENCE_DRMS=6.7e-3

# Max displacement convergence (Angstrom)
# geomeTRIC default (GAU set): 1.8e-3
# GAU_LOOSE set: 1e-2 (faster convergence)
OPT_CONVERGENCE_DMAX=1e-2

# Maximum geometry optimization steps
# Typical: 50 (fast), 200 (difficult cases)
OPT_MAXSTEPS=100


# ============================================================================
# OPTIONAL OUTPUT FILES
# ============================================================================

# Save trajectory of the optimization
OUT_TRAJECTORY=True

# Save molden file with molecular orbitals
OUT_MOLDEN=False

# Save checkpoint files
OUT_CHKFILES=False

# TODO: CUB, DATASET
# TODO: add more data to output file


# Comments extracted from run config file
COMMENTS=